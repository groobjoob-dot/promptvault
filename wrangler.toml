name = "promptvault"
compatibility_date = "2026-08-19"

pages_build_output_dir = "./dist"

# R2 bucket binding for images
[[r2_buckets]]
binding = "PROMPTS"
bucket_name = "promptvault-images"
preview_bucket_name = "promptvault-images-preview"

# Environment variables
[vars]
SITE_URL = "https://promptvault.dev"
